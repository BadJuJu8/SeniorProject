- name: Deploy detection-as-code Wazuh rules
  hosts: wazuh_manager
  become: true
  gather_facts: false
  vars:
    ossec_rules: /var/ossec/etc/rules/local_rules.xml
    candidate_rules: /var/ossec/etc/rules/local_rules_candidate.xml
  tasks:
  - block:
    - name: Copy local_rules.xml to the manager
      ansible.builtin.copy:
        src: ../rules/wazuh/local_rules.xml
        dest: "{{ ossec_rules }}"
        owner: wazuh
        group: wazuh
        mode: "0660"
        backup: true
      register: rules_copy

    - name: discard the candidate file when promoting.
      ansible.builtin.file:
        path: "{{ candidate_rules }}"
        state: absent
      register: candidate_removed

    - name: validate the ruleset compiles (wazuh-analysisd -t)
      ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
      register: analysisd_test
      changed_when: false
      failed_when: analysisd_test.rc != 0

    rescue:
      - name: Restore the previous ruleset after a validation failure
        ansible.builtin.copy:
          src: "{{ rules_copy.backup_file }}"
          dest: "{{ ossec_rules }}"
          remote_src: true
          owner: wazuh
          group: wazuh
          mode: "0660"
        when: rules_copy.backup_file is defined

      - name: fail the deploy (Ruleset invalid, previous rules restored)
        ansible.builtin.fail:
          msg: "wazuh-analysisd -t rejected the new ruleset. The previous local_rules.xml has been restored and the manager was NOT reloaded."

  - name: Restart the Wazuh manager to load the new rules
    ansible.builtin.systemd:
      name: wazuh-manager
      state: restarted
    when: rules_copy is changed or candidate_removed is changed

  - name: Confirm the manager came back up healthy
    ansible.builtin.command: /var/ossec/bin/wazuh-control status
    register: wazuh_status
    changed_when: false
    failed_when: "'wazuh-analysisd is running' not in wazuh_status.stdout"

  - name: Report
    ansible.builtin.debug:
      msg: "Rules deployed and manager reloaded. analysisd status OK."
    when: rules_copy is changed or candidate_removed is changed
