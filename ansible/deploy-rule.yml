---
# Deploy the verified Wazuh detection rules to the manager and reload it.
#
# Called by the `deploy` job in .gitea/workflows/detect.yml, only AFTER the two-tier
# detection test has passed. Safe by construction: it backs up the live ruleset,
# validates that the new ruleset compiles with `wazuh-analysisd -t` BEFORE restarting,
# and restores the backup if validation fails — so a bad rule can never take the
# manager offline.
#
#   ansible-playbook -i inventory.ini ansible/deploy-rule.yml
#
# Target host group: wazuh_manager (see inventory.example.ini).
- name: Deploy detection-as-code Wazuh rules
  hosts: wazuh_manager
  become: true
  gather_facts: false
  vars:
    ossec_rules: /var/ossec/etc/rules/local_rules.xml

  tasks:
    - name: Deploy and validate ruleset
      block:
        - name: Copy local_rules.xml to the manager
          ansible.builtin.copy:
            src: ../rules/wazuh/local_rules.xml
            dest: "{{ ossec_rules }}"
            owner: wazuh
            group: wazuh
            mode: "0660"
            backup: true
          register: rules_copy

        - name: Validate the ruleset compiles (wazuh-analysisd -t)
          ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
          register: analysisd_test
          changed_when: false
          failed_when: analysisd_test.rc != 0

      rescue:
        - name: Restore the previous ruleset after a validation failure
          ansible.builtin.copy:
            src: "{{ rules_copy.backup_file }}"
            dest: "{{ ossec_rules }}"
            remote_src: true
            owner: wazuh
            group: wazuh
            mode: "0660"
          when: rules_copy.backup_file is defined

        - name: Fail the deploy (ruleset invalid, previous rules restored)
          ansible.builtin.fail:
            msg: >-
              wazuh-analysisd -t rejected the new ruleset. The previous
              local_rules.xml has been restored and the manager was NOT reloaded.

    - name: Restart the Wazuh manager to load the new rules
      ansible.builtin.systemd:
        name: wazuh-manager
        state: restarted
      when: rules_copy is changed

    - name: Confirm the manager came back healthy
      ansible.builtin.command: /var/ossec/bin/wazuh-control status
      register: wazuh_status
      changed_when: false
      failed_when: "'wazuh-analysisd is running' not in wazuh_status.stdout"

    - name: Report
      ansible.builtin.debug:
        msg: "Rules deployed and manager reloaded. analysisd status OK."
      when: rules_copy is changed
