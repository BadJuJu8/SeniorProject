# Example inventory — copy to inventory.ini (gitignored) and fill in real values,
# or have CI materialize inventory.ini from the ANSIBLE_INVENTORY Gitea secret.
#
# Real host IPs and SSH details are infrastructure specifics and must NOT be
# committed (see secrets/README.md).

[wazuh_manager]
wazuh01 ansible_host=10.10.50.10

[wazuh_manager:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/lab_id_ed25519
ansible_python_interpreter=/usr/bin/python3
