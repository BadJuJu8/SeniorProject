title: Kerberoasting - RC4-HMAC Service Ticket Request (T1558.003)
id: b3e9a1d2-4c7f-4a6e-9f2b-1c8d5e0a7f34
status: experimental
description: |
    Detects a Kerberos service-ticket (TGS, Event 4769) request encrypted with RC4-HMAC
    (0x17) - the signature of Kerberoasting. Hand-authored from a live 4769 captured in the
    lab, then hardened against the reference rule. The filter drops machine-account SPNs,
    the krbtgt service, and machine-account requestors so the DC's normal service-ticket
    traffic does not alert.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1558.003/T1558.003.md
author: Robert Garcia
date: 2026-08-31
tags:
    - attack.credential_access
    - attack.t1558.003
logsource:
    product: windows
    service: security
    definition: 'Requires "Audit Kerberos Service Ticket Operations" (Success) so Event ID 4769 is logged on all domain controllers.'
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'   # RC4-HMAC: weak, crackable offline
        Status: '0x0'                  # only successfully issued (i.e. crackable) tickets
    filter:
        - ServiceName|endswith: '$'      # machine-account SPNs (requested constantly, benign)
        - ServiceName: 'krbtgt'          # the KDC service itself, never a roast target
        - TargetUserName|contains: '$@'  # machine-account requestors, e.g. WS01$@REALM
    condition: selection and not filter
falsepositives:
    - Legacy applications or service accounts still configured for RC4 (baseline before alerting; enforce AES long-term).
    - Authorized vulnerability scanners or red-team tooling performing SPN enumeration.
level: high
